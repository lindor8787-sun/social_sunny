<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Social ERP · 個人社會資訊站</title>
<style>
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface2:#f0f3f8; --line:#e2e8f0;
  --text:#1f2933; --muted:#64748b; --primary:#2563eb; --primary-soft:#dbeafe;
  --green:#16a34a; --green-soft:#dcfce7; --red:#dc2626; --red-soft:#fee2e2;
  --amber:#d97706; --amber-soft:#fef3c7; --sidebar:#0f1b2d; --sidebar-text:#c6d2e2;
  --sidebar-active:#2563eb; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);
}
[data-theme="dark"]{
  --bg:#0b1220; --surface:#131c2b; --surface2:#1b2638; --line:#263447;
  --text:#e8eef5; --muted:#93a4ba; --primary:#3b82f6; --primary-soft:#1e293b;
  --green:#34d399; --green-soft:#0f2a20; --red:#f87171; --red-soft:#2a1414;
  --amber:#fbbf24; --amber-soft:#2a2410; --sidebar:#070d16; --sidebar-text:#9fb0c6;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);
  font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--sidebar);color:var(--sidebar-text);flex-shrink:0;
  position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{padding:18px 20px;font-size:1.15rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:9px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand small{display:block;font-size:.65rem;color:var(--sidebar-text);font-weight:400;margin-top:2px}
.nav{padding:10px 0;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 20px;color:var(--sidebar-text);
  font-size:.92rem;cursor:pointer;border-left:3px solid transparent}
.nav a:hover{background:rgba(255,255,255,.05);color:#fff}
.nav a.active{background:rgba(37,99,235,.18);border-left-color:var(--sidebar-active);color:#fff;font-weight:600}
.nav .ico{width:20px;text-align:center;font-size:1.05rem}
.sb-foot{padding:12px 20px;font-size:.7rem;color:#64748b;border-top:1px solid rgba(255,255,255,.07)}

.main{flex:1;margin-left:230px;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30}
.topbar .ptitle{font-size:1.1rem;font-weight:700;margin-right:auto}
.hamb{display:none;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text)}
.tb-btn{background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;height:38px;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:.88rem}
.tb-btn:hover{border-color:var(--primary)}
.tb-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.month-sel{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);
  border:1px solid var(--line);border-radius:8px;height:38px;padding:0 6px}
.month-sel button{background:none;border:none;cursor:pointer;color:var(--text);font-size:1rem;padding:0 6px}
.month-sel b{font-size:.88rem;min-width:70px;text-align:center}
.content{padding:22px;max-width:1240px;width:100%}

/* generic */
.row{display:flex;flex-wrap:wrap;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 4px;font-size:1rem}
.card .hint{color:var(--muted);font-size:.8rem;margin:0 0 12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-h h3{margin:0}
.kpi .label{color:var(--muted);font-size:.82rem}
.kpi .val{font-size:1.6rem;font-weight:800;margin:4px 0 2px}
.kpi .delta{font-size:.78rem}
.pos{color:var(--green)} .neg{color:var(--red)}
.badge{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.badge.b-入門,.badge.b-green{background:var(--green-soft);color:var(--green);border:none}
.badge.b-初級,.badge.b-blue{background:var(--primary-soft);color:var(--primary);border:none}
.badge.b-中級,.badge.b-amber{background:var(--amber-soft);color:var(--amber);border:none}
.progress{height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px}
.progress.g>i{background:var(--green)} .progress.a>i{background:var(--amber)} .progress.r>i{background:var(--red)}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:none}
tr:last-child td{border-bottom:none}
.t-right{text-align:right} .t-center{text-align:center}

input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:9px 11px;font-size:.9rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
label.fld{display:block;margin-bottom:12px}
label.fld>span{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px}
.err-msg{color:var(--red);font-size:.76rem;margin-top:4px;display:none}
label.fld.bad input,label.fld.bad select{border-color:var(--red)}
label.fld.bad .err-msg{display:block}
.btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:.9rem}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:.82rem}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.iconbtn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:.95rem;padding:4px 6px;border-radius:6px}
.iconbtn:hover{background:var(--surface2);color:var(--text)}

.empty{text-align:center;color:var(--muted);padding:34px 10px}
.empty .big{font-size:2rem;opacity:.5}
.list-split{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.list-split:last-child{border-bottom:none}
.muted{color:var(--muted)} .sm{font-size:.82rem} .mt{margin-top:14px} .mb{margin-bottom:12px}
.pill-amt{font-weight:700} .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700}

/* toast + modal */
#toast{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);
  border-radius:9px;padding:12px 16px;box-shadow:var(--shadow);min-width:220px;animation:sl .2s}
.toast.ok{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
@keyframes sl{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
#overlay{position:fixed;inset:0;background:rgba(10,16,28,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:16px}
#overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:460px;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
.modal.lg{max-width:640px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.modal-b{padding:20px} .modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

@media(max-width:900px){
  .g4{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:1fr} .g2{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)} .sidebar.open{transform:none}
  .main{margin-left:0} .hamb{display:block} .content{padding:16px}
}/* ===== Social ERP 新增樣式 ===== */
.feed-item{display:block;padding:13px 0;border-bottom:1px solid var(--line)}
.feed-item:last-child{border-bottom:none}
.feed-item a.ft{font-weight:600;color:var(--text);font-size:.97rem;line-height:1.5;display:block}
.feed-item a.ft:hover{color:var(--primary)}
.feed-meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:.76rem;color:var(--muted)}
.src-tag{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:.73rem}
.feed-sum{color:var(--muted);font-size:.85rem;margin-top:5px;line-height:1.55}
.star{cursor:pointer;border:none;background:none;font-size:1rem;opacity:.35;padding:0 2px}
.star.on{opacity:1}
.tblwrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.87rem}
.tbl th{position:sticky;top:0;z-index:5;background:var(--surface2);text-align:left;
  padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--surface2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.up{color:var(--red);font-weight:600}
.down{color:var(--green);font-weight:600}
.flat{color:var(--muted)}
.law-sec{border-left:3px solid var(--primary);padding:2px 0 2px 14px;margin:18px 0}
.law-sec h4{margin:0 0 7px;font-size:1rem}
.law-art{background:var(--surface2);border-radius:8px;padding:11px 13px;margin:9px 0;
  font-size:.87rem;line-height:1.65;white-space:pre-line}
.law-cite{font-size:.76rem;color:var(--muted);margin-top:6px}
.warnbox{background:var(--amber-soft);border:1px solid var(--amber);border-radius:9px;
  padding:12px 14px;margin:14px 0;font-size:.86rem;line-height:1.6}
.warnbox b{color:var(--amber)}
.srcbox{background:var(--surface2);border-radius:9px;padding:11px 13px;font-size:.83rem;color:var(--muted);line-height:1.7}
.stale{background:var(--red-soft);border:1px solid var(--red);border-radius:9px;padding:11px 14px;margin-bottom:14px;font-size:.86rem}
.cal-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.cal-row:last-child{border-bottom:none}
.cal-m{flex:0 0 58px;font-weight:700;color:var(--primary);font-size:.9rem}
.cal-b{flex:1;font-size:.88rem;line-height:1.6}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.linkgrid a{display:block;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);
  border-radius:9px;font-size:.86rem;color:var(--text)}
.linkgrid a:hover{border-color:var(--primary);color:var(--primary)}
.srcstat{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.srcstat:last-child{border-bottom:none}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)}
@media(max-width:900px){ .tbl{font-size:.8rem} .tbl td,.tbl th{padding:8px 9px} }
</style>
</head>

<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">🧭 Social ERP<small>個人社會資訊站</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">資料來自公開 RSS 與政府開放 API</div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div class="ptitle" id="ptitle">資訊摘要</div>
      <div id="tb-extra" style="display:flex;gap:10px;align-items:center"></div>
      <button class="tb-btn" id="themeBtn" title="切換深/淺色">🌙</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
<div id="overlay"><div id="modalBox"></div></div>
<div id="toast"></div>
<script>

/* ===================== helpers ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9);
const CUR={TWD:'NT$',USD:'US$'};
function fmt(n){return (CUR[STORE.d.settings.currency]||'NT$')+' '+Math.round(n).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function monthLabel(m){return m.replace('-','年')+'月';}
function addMonth(m,d){let[y,mo]=m.split('-').map(Number);mo+=d;if(mo<1){mo=12;y--}if(mo>12){mo=1;y++}return y+'-'+String(mo).padStart(2,'0');}
function todayStr(){return new Date().toISOString().slice(0,10);}

function toast(msg,type){const t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;$('#toast').appendChild(t);setTimeout(()=>t.remove(),2600);}
function closeModal(){$('#overlay').classList.remove('show');$('#modalBox').innerHTML='';}
function modal(title,bodyHtml,footHtml,size){
  $('#modalBox').outerHTML='<div id="modalBox"></div>';
  const box=$('#modalBox');
  box.innerHTML='<div class="modal '+(size||'')+'"><div class="modal-h"><span>'+esc(title)+'</span><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="modal-b">'+bodyHtml+'</div>'+(footHtml?'<div class="modal-f">'+footHtml+'</div>':'')+'</div>';
  $('#overlay').classList.add('show');
}
function confirmDialog(msg,onYes,yesLabel){
  modal('請確認','<p style="margin:0 0 4px">'+esc(msg)+'</p>',
    '<button class="btn ghost" onclick="closeModal()">取消</button><button class="btn danger" id="cfmYes">'+(yesLabel||'確定')+'</button>');
  $('#cfmYes').onclick=()=>{closeModal();onYes();};
}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal();});

/* ===================== charts (dependency-free canvas) ===================== */
function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function setupCanvas(cv,h){const w=cv.clientWidth||cv.parentElement.clientWidth;cv.width=w*devicePixelRatio;cv.height=h*devicePixelRatio;cv.style.height=h+'px';const x=cv.getContext('2d');x.scale(devicePixelRatio,devicePixelRatio);return{x,w,h};}
function barChart(cv,labels,series){ // series:[{name,color,data}]
  const h=cv.dataset.h?+cv.dataset.h:220;const{x,w}=setupCanvas(cv,h);
  const pad={l:52,r:12,t:14,b:26};const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const all=series.flatMap(s=>s.data);const max=Math.max(1,...all)*1.15;
  x.strokeStyle=cssVar('--line');x.fillStyle=cssVar('--muted');x.font='11px sans-serif';x.lineWidth=1;
  for(let i=0;i<=4;i++){const gy=pad.t+ih*i/4;x.beginPath();x.moveTo(pad.l,gy);x.lineTo(w-pad.r,gy);x.stroke();
    x.textAlign='right';x.fillText(Math.round(max*(4-i)/4/1000)+'k',pad.l-8,gy+3);}
  const groups=labels.length;const gw=iw/groups;const bw=Math.min(26,gw/(series.length+1));
  labels.forEach((lb,gi)=>{const gx=pad.l+gw*gi+gw/2;
    series.forEach((s,si)=>{const v=s.data[gi]||0;const bh=ih*v/max;
      const bx=gx-(series.length*bw)/2+si*bw;x.fillStyle=s.color;
      x.fillRect(bx,pad.t+ih-bh,bw-3,bh);});
    x.fillStyle=cssVar('--muted');x.textAlign='center';x.fillText(lb,gx,h-8);});
}
function lineChart(cv,labels,data,color){
  const h=cv.dataset.h?+cv.dataset.h:220;const{x,w}=setupCanvas(cv,h);
  const pad={l:56,r:14,t:14,b:26};const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const max=Math.max(1,...data)*1.1,min=Math.min(0,...data);
  x.strokeStyle=cssVar('--line');x.fillStyle=cssVar('--muted');x.font='11px sans-serif';
  for(let i=0;i<=4;i++){const gy=pad.t+ih*i/4;x.beginPath();x.moveTo(pad.l,gy);x.lineTo(w-pad.r,gy);x.stroke();
    x.textAlign='right';x.fillText(Math.round((max-(max-min)*i/4)/1000)+'k',pad.l-8,gy+3);}
  const step=iw/Math.max(1,labels.length-1);
  x.strokeStyle=color;x.lineWidth=2.4;x.beginPath();
  const pts=data.map((v,i)=>[pad.l+step*i,pad.t+ih-ih*(v-min)/(max-min||1)]);
  pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
  x.fillStyle=color;pts.forEach(p=>{x.beginPath();x.arc(p[0],p[1],3,0,7);x.fill();});
  x.fillStyle=cssVar('--muted');x.textAlign='center';labels.forEach((lb,i)=>{if(labels.length>8&&i%2)return;x.fillText(lb,pad.l+step*i,h-8);});
}
function donut(cv,items){ // items:[{label,value,color}]
  const h=cv.dataset.h?+cv.dataset.h:200;const{x,w}=setupCanvas(cv,h);
  const cx=h/2+6,cy=h/2,r=h/2-12,ir=r*0.6;const tot=items.reduce((a,b)=>a+b.value,0)||1;
  let a=-Math.PI/2;items.forEach(it=>{const sl=it.value/tot*Math.PI*2;x.beginPath();x.moveTo(cx,cy);
    x.arc(cx,cy,r,a,a+sl);x.closePath();x.fillStyle=it.color;x.fill();a+=sl;});
  x.fillStyle=cssVar('--surface');x.beginPath();x.arc(cx,cy,ir,0,7);x.fill();
  x.fillStyle=cssVar('--text');x.font='bold 13px sans-serif';x.textAlign='center';x.fillText('支出占比',cx,cy+4);
  // legend
  x.font='12px sans-serif';x.textAlign='left';let ly=24;items.forEach(it=>{x.fillStyle=it.color;x.fillRect(h+8,ly-9,11,11);
    x.fillStyle=cssVar('--muted');x.fillText(it.label+'  '+Math.round(it.value/tot*100)+'%',h+24,ly);ly+=22;});
}
const PALETTE=['#2563eb','#16a34a','#d97706','#db2777','#7c3aed','#0891b2','#dc2626','#64748b'];

function ART_SEED(){return [
 {id:'a1',cat:'基礎觀念',level:'入門',title:'先建立緊急預備金，再開始投資',mins:4,
  plain:'投資前，先存下 3～6 個月生活費放在隨時能動用的地方（活存或高利定存），當作意外時的安全網。有了它，投資遇到下跌時才不必被迫在低點賣出求現。',
  example:'小美月支出 2 萬，她先存了 8 萬（約 4 個月）當預備金，之後臨時要修機車、看牙都能從這裡出，不必動到投資或刷卡分期。',
  points:['預備金 = 3～6 個月生活費','放在活存/定存，不要拿去投資','有了它才開始投資，心理更穩'],
  related:['a2','a9']},
 {id:'a2',cat:'基礎觀念',level:'入門',title:'風險與報酬是一體兩面',mins:3,
  plain:'報酬愈高，通常要承受的波動與虧損風險也愈高。任何宣稱「高報酬又零風險／保證獲利」的，幾乎都是詐騙。',
  example:'有人在 LINE 群保證「月賺 20%」，這遠高於正常市場報酬，是典型詐騙話術。',
  points:['高報酬必然伴隨高風險','先認識自己的風險承受度','聽到「保證獲利」要提高警覺'],
  related:['a7','a9']},
 {id:'a3',cat:'投資工具',level:'入門',title:'什麼是 ETF？和個股有什麼不同',mins:5,

let DATA=EMBEDDED_DB;
let DATA_SOURCE='embedded';
async function loadData(){
  // 用 file:// 直接開啟時，瀏覽器一定會擋跨來源讀取，連試都不要試，
  // 免得在 console 留下看起來像壞掉的紅字。直接用內嵌種子資料。
  if(location.protocol==='file:'){DATA=EMBEDDED_DB;DATA_SOURCE='embedded';return;}
  try{
    const r=await fetch('data/db.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(j&&j.feeds){DATA=j;DATA_SOURCE='file';}
  }catch(e){DATA=EMBEDDED_DB;DATA_SOURCE='embedded';}
}
function allFeedItems(keys){
  const out=[];
  (keys||Object.keys(DATA.feeds||{})).forEach(k=>{
    const f=(DATA.feeds||{})[k];if(!f)return;
    (f.items||[]).forEach(it=>out.push(Object.assign({feedKey:k},it)));
  });
  out.sort((a,b)=>String(b.date||b.added_date||'').localeCompare(String(a.date||a.added_date||'')));
  return out;
}
function dataAgeDays(){
  const t=DATA.updated_at;if(!t)return null;
  const d=new Date(t);if(isNaN(d))return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function relTime(iso){
  if(!iso)return '';
  const d=new Date(iso);if(isNaN(d))return String(iso).slice(0,16).replace('T',' ');
  const mins=Math.floor((Date.now()-d.getTime())/60000);
  if(mins<1)return '剛剛';
  if(mins<60)return mins+' 分鐘前';
  if(mins<1440)return Math.floor(mins/60)+' 小時前';
  const days=Math.floor(mins/1440);
  if(days<8)return days+' 天前';
  return d.toISOString().slice(0,10);
}
function isStar(id){return (STORE.d.starred||[]).indexOf(id)>=0;}
function toggleStar(id,re){
  STORE.d.starred=STORE.d.starred||[];
  const i=STORE.d.starred.indexOf(id);
  if(i>=0){STORE.d.starred.splice(i,1);toast('已取消收藏');}
  else{STORE.d.starred.push(id);toast('已加入收藏','ok');}
  STORE.save(); if(re!==false)RENDER[CURRENT]();
}
function feedItemHtml(it){
  const link=it.link?('<a class="ft" href="'+esc(it.link)+'" target="_blank" rel="noopener">'+esc(it.title)+'</a>')
                    :('<span class="ft">'+esc(it.title)+'</span>');
  return '<div class="feed-item">'+
    '<div style="display:flex;gap:8px;align-items:flex-start">'+
      '<button class="star '+(isStar(it.id)?'on':'')+'" onclick="toggleStar(\''+it.id+'\')" title="收藏">★</button>'+
      '<div style="flex:1;min-width:0">'+link+
        (it.summary?'<div class="feed-sum">'+esc(it.summary)+'</div>':'')+
        '<div class="feed-meta"><span class="src-tag">'+esc(it.source||'')+'</span><span>'+esc(relTime(it.date))+'</span></div>'+
      '</div></div></div>';
}

function nav(id,keepView){
  CURRENT=id;if(!keepView)STORE.d.ui.view=null;STORE.save();
  $$('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  $('#ptitle').textContent=(PAGES.find(p=>p.id===id)||{}).name||'';
  $('#tb-extra').innerHTML='';
  $('#sidebar').classList.remove('open');
  window.scrollTo(0,0);
  RENDER[id]();
}

function card(title,body,extra){
  return '<div class="card"><div class="card-h"><h3>'+title+'</h3>'+(extra||'')+'</div>'+body+'</div>';
}
function staleBanner(){
  const d=dataAgeDays();
  if(DATA_SOURCE==='embedded')
    return '<div class="stale">目前顯示的是<b>內建種子資料</b>。你是用本機檔案直接開啟，瀏覽器不允許讀取 data/db.json。部署到 GitHub Pages 後就會自動顯示最新資料。</div>';
  if(d!==null&&d>=3)
    return '<div class="stale">資料已經 <b>'+d+' 天</b>沒更新了。到 GitHub repo 的 Actions 頁籤看看排程是不是失敗了。</div>';
  return '';
}

/* ========== 以來源分頁的清單頁 ========== */
function feedPage(keys,title){
  const v=STORE.d.ui.feedTab||'all';
  const tabs=[['all','全部']].concat(keys.map(k=>[k,((DATA.feeds||{})[k]||{}).source||k]));
  const items=allFeedItems(v==='all'?keys:[v]);
  const bad=keys.filter(k=>((DATA.feeds||{})[k]||{}).ok===false);
  let warn='';
  if(bad.length){
    warn='<div class="warnbox"><b>有來源抓取失敗：</b>'+
      bad.map(k=>esc(((DATA.feeds||{})[k]||{}).source||k)).join('、')+
      '。清單顯示的是上一次成功抓到的內容。</div>';
  }
  $('#content').innerHTML=staleBanner()+warn+
    '<div class="btn-row mb">'+tabs.map(t=>'<button class="chip '+(v===t[0]?'active':'')+
      '" onclick="feedTab(\''+t[0]+'\')">'+esc(t[1])+'</button>').join('')+'</div>'+
    card(title+' <span class="muted sm">· '+items.length+' 則</span>',
      items.length?items.map(feedItemHtml).join(''):emptyBox('尚無資料，跑過一次更新後就會有內容'));
}

/* ========== CALCULATORS ========== */
const CALC={tool:'compound'};
const TOOLS={
 compound:{name:'複利計算器',
   fields:[{k:'p',label:'起始本金',def:100000,suf:'元'},{k:'pmt',label:'每月投入',def:5000,suf:'元'},
           {k:'r',label:'年報酬率',def:6,suf:'%',max:40},{k:'y',label:'investment 年數',label2:'投資年數',def:20,suf:'年',max:60}],
   compute(v){const n=v.y*12,i=v.r/100/12;let bal=v.p;const series=[v.p];
     for(let m=1;m<=n;m++){bal=bal*(1+i)+v.pmt;if(m%12===0)series.push(bal);}
     const contrib=v.p+v.pmt*n;const interest=bal-contrib;
     return{rows:[['期末本利和',fmt(bal),'big'],['累計投入本金',fmt(contrib)],['累計報酬',fmt(interest),'pos']],
       assume:['每月複利計算，報酬率固定為年 '+v.r+'%','每月月底投入 '+fmt(v.pmt)+'，共 '+v.y+' 年','未計入稅負、手續費與通膨'],
       chart(cv){lineChart(cv,series.map((_,i)=>i+'y'),series,'#2563eb');}};}},
 savings:{name:'儲蓄目標試算',
   fields:[{k:'goal',label:'目標金額',def:600000,suf:'元'},{k:'y',label:'達成年數',def:5,suf:'年',max:50},
           {k:'r',label:'年利率/報酬率',def:2,suf:'%',max:40}],
   compute(v){const n=v.y*12,i=v.r/100/12;const pmt=i===0?v.goal/n:v.goal*i/(Math.pow(1+i,n)-1);
     const contrib=pmt*n;const interest=v.goal-contrib;let bal=0;const series=[0];
     for(let m=1;m<=n;m++){bal=bal*(1+i)+pmt;if(m%12===0)series.push(bal);}
     return{rows:[['每月需存',fmt(pmt),'big'],['累計本金投入',fmt(contrib)],['利息貢獻',fmt(Math.max(0,interest)),'pos']],
       assume:['為達成 '+fmt(v.goal)+' 的目標，需每月固定存入上述金額','年利率假設固定為 '+v.r+'%，每月複利','未計入稅負與通膨'],
       chart(cv){lineChart(cv,series.map((_,i)=>i+'y'),series,'#16a34a');}};}},
 loan:{name:'貸款月付金試算',
   fields:[{k:'amt',label:'貸款金額',def:1000000,suf:'元'},{k:'r',label:'年利率',def:3,suf:'%',max:30},
           {k:'y',label:'貸款年數',def:20,suf:'年',max:40}],
   compute(v){const n=v.y*12,i=v.r/100/12;const pay=i===0?v.amt/n:v.amt*i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1);
     const total=pay*n;const interest=total-v.amt;
     return{rows:[['每月應繳',fmt(pay),'big'],['總還款金額',fmt(total)],['總利息支出',fmt(interest),'neg']],
       assume:['採本息平均攤還（每月繳款相同）','年利率固定為 '+v.r+'%，共 '+(v.y*12)+' 期','未計入開辦費、寬限期與提前還款'],
       chart(cv){donut(cv,[{label:'本金',value:v.amt,color:'#2563eb'},{label:'利息',value:interest,color:'#dc2626'}]);}};}},
 inflation:{name:'通膨與購買力試算',
   fields:[{k:'amt',label:'目前金額',def:1000000,suf:'元'},{k:'r',label:'年通膨率',def:2.5,suf:'%',max:30},
           {k:'y',label:'年數',def:20,suf:'年',max:60}],
   compute(v){const f=Math.pow(1+v.r/100,v.y);const future=v.amt/f;const needed=v.amt*f;
     const series=[];for(let yy=0;yy<=v.y;yy++)series.push(v.amt/Math.pow(1+v.r/100,yy));
     return{rows:[[v.y+' 年後的實質購買力',fmt(future),'big'],['相當於現在的',fmt(future)],['要維持同等購買力需有',fmt(needed),'neg']],
       assume:['通膨率固定為年 '+v.r+'%','購買力 = 金額 ÷ (1+通膨率)^年數','僅反映物價侵蝕，未計投資報酬'],
       chart(cv){lineChart(cv,series.map((_,i)=>i+'y'),series,'#d97706');}};}},
 emergency:{name:'緊急預備金計算',
   fields:[{k:'exp',label:'每月必要支出',def:30000,suf:'元'},{k:'mo',label:'想準備幾個月',def:6,suf:'個月',max:24},
           {k:'cur',label:'目前已存',def:120000,suf:'元'},{k:'save',label:'每月可再存',def:8000,suf:'元'}],
   compute(v){const target=v.exp*v.mo;const gap=Math.max(0,target-v.cur);const months=v.save>0?Math.ceil(gap/v.save):Infinity;
     const pct=Math.min(100,Math.round(v.cur/target*100));
     return{rows:[['建議預備金目標',fmt(target),'big'],['目前進度',pct+'%'],['還差',fmt(gap),'neg'],['預計達成還要',gap===0?'已達成 ✅':(months===Infinity?'—':months+' 個月')]],
       assume:['建議預備金 = 每月必要支出 × 月數（一般 3～6 個月）','預備金請放在活存/定存等隨時可動用處','不投入波動性資產'],
       chart(cv){barChart(cv,['目前','目標'],[{name:'',color:'#2563eb',data:[v.cur,target]}]);}};}},
};
RENDER.calculators=function(){
  const tools=Object.keys(TOOLS);
  $('#content').innerHTML='<div class="btn-row mb">'+tools.map(k=>'<button class="chip '+(CALC.tool===k?'active':'')+'" onclick="calcTool(\''+k+'\')">'+TOOLS[k].name+'</button>').join('')+'</div>'+
    '<div class="grid g2"><div class="card"><div class="card-h"><h3>'+TOOLS[CALC.tool].name+'</h3></div><div id="calcForm"></div>'+
    '<div class="btn-row mt"><button class="btn ghost sm" onclick="calcReset()">重設</button><button class="btn sm" onclick="calcSave()">儲存試算</button></div></div>'+
    '<div class="card"><div class="card-h"><h3>試算結果</h3></div><div id="calcRes"></div>'+
    '<canvas id="calcChart" data-h="200" class="mt"></canvas>'+
    '<p class="muted sm mt">※ 試算結果僅供教育與情境分析，採簡化假設，<b>不保證任何投資收益</b>，實際會因稅費、通膨與市場波動而不同。</p></div></div>';
  calcRenderForm();
};
function calcTool(k){CALC.tool=k;RENDER.calculators();}
function calcVals(){const t=TOOLS[CALC.tool];const v={};let ok=true;
  t.fields.forEach(f=>{const el=$('#f_'+f.k);const raw=el?el.value:f.def;const num=parseFloat(raw);
    const lab=el?el.closest('label'):null;
    const bad=isNaN(num)||num<0||(f.max&&num>f.max);
    if(lab)lab.classList.toggle('bad',bad);if(bad)ok=false;v[f.k]=isNaN(num)?0:num;});
  return ok?v:null;}
function calcRenderForm(def){const t=TOOLS[CALC.tool];
  $('#calcForm').innerHTML=t.fields.map(f=>'<label class="fld"><span>'+(f.label2||f.label)+'（'+f.suf+'）</span>'+
    '<input id="f_'+f.k+'" type="number" step="any" value="'+(def?f.def:(getCalcDefault(f)))+'"><span class="err-msg">請輸入 0～'+(f.max||'∞')+' 的有效數字</span></label>').join('');
  calcCompute();
}
function getCalcDefault(f){return f.def;}
function calcReset(){calcRenderForm(true);toast('已重設為預設值');}
function calcCompute(){const v=calcVals();const res=$('#calcRes');
  if(!v){res.innerHTML='<div class="empty">請修正紅色欄位的輸入</div>';return;}
  const out=TOOLS[CALC.tool].compute(v);
  res.innerHTML=out.rows.map(r=>r[2]==='big'
    ?'<div class="kpi mb"><div class="label">'+r[0]+'</div><div class="val">'+r[1]+'</div></div>'
    :'<div class="list-split"><span class="muted">'+r[0]+'</span><span class="pill-amt '+(r[2]||'')+'">'+r[1]+'</span></div>').join('')+
    '<h4 style="margin:14px 0 6px">計算假設</h4><ul class="muted sm" style="margin:0;padding-left:18px">'+out.assume.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>';
  out.chart($('#calcChart'));
}
function calcSave(){const v=calcVals();if(!v){toast('請先修正輸入','bad');return;}
  const out=TOOLS[CALC.tool].compute(v);
  STORE.d.calcHistory.unshift({id:uid(),tool:TOOLS[CALC.tool].name,at:todayStr(),headline:out.rows[0][0]+'：'+out.rows[0][1]});
  STORE.d.calcHistory=STORE.d.calcHistory.slice(0,30);STORE.save();toast('已儲存這次試算','ok');}
document.addEventListener('input',e=>{if(e.target&&/^f_/.test(e.target.id||'')){calcCompute();}});


/* ===================== 主題 + 啟動 ===================== */
function applyTheme(){
  const t=(STORE.d.settings&&STORE.d.settings.theme)||'light';
  document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').textContent=t==='dark'?'☀️':'🌙';
}
$('#themeBtn').onclick=function(){
  STORE.d.settings.theme=(STORE.d.settings.theme==='dark')?'light':'dark';
  STORE.save();applyTheme();RENDER[CURRENT]();
};
STORE.load();
if(!STORE.d.settings.theme)STORE.d.settings.theme='light';
applyTheme();
buildNav();
$('#content').innerHTML='<div class="empty">載入資料中…</div>';
loadData().then(function(){ nav('dashboard'); });
</script>
